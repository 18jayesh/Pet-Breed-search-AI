version: '3.8'

services:
  # Optional distributed Redis store for cross-instance rate limiting
  redis:
    image: redis:7-alpine
    container_name: petvision-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - petvision-net

  # Backend Instance 1
  backend-1:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: petvision-backend-1
    restart: unless-stopped
    ports:
      - "5001:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-3.5-flash-lite}
      - FRONTEND_URL=http://localhost
      - MAX_FILE_SIZE=5242880
      - GENERAL_RATE_LIMIT=100
      - AI_RATE_LIMIT=5
      - RATE_LIMIT_WINDOW_MS=900000
      - REDIS_URL=redis://redis:6379
      - TRUST_PROXY=true
    depends_on:
      - redis
    networks:
      - petvision-net

  # Backend Instance 2
  backend-2:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: petvision-backend-2
    restart: unless-stopped
    ports:
      - "5002:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-3.5-flash-lite}
      - FRONTEND_URL=http://localhost
      - MAX_FILE_SIZE=5242880
      - GENERAL_RATE_LIMIT=100
      - AI_RATE_LIMIT=5
      - RATE_LIMIT_WINDOW_MS=900000
      - REDIS_URL=redis://redis:6379
      - TRUST_PROXY=true
    depends_on:
      - redis
    networks:
      - petvision-net

  # Backend Instance 3
  backend-3:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: petvision-backend-3
    restart: unless-stopped
    ports:
      - "5003:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-3.5-flash-lite}
      - FRONTEND_URL=http://localhost
      - MAX_FILE_SIZE=5242880
      - GENERAL_RATE_LIMIT=100
      - AI_RATE_LIMIT=5
      - RATE_LIMIT_WINDOW_MS=900000
      - REDIS_URL=redis://redis:6379
      - TRUST_PROXY=true
    depends_on:
      - redis
    networks:
      - petvision-net

  # Frontend Application
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: petvision-frontend
    restart: unless-stopped
    networks:
      - petvision-net

  # Nginx Reverse Proxy and Load Balancer
  nginx:
    image: nginx:alpine
    container_name: petvision-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend-1
      - backend-2
      - backend-3
      - frontend
    networks:
      - petvision-net

networks:
  petvision-net:
    driver: bridge

volumes:
  redis_data:
