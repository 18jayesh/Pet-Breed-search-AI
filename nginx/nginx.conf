events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        image/svg+xml;

    # Upstream backend pool for horizontal load balancing
    upstream petvision_backend {
        least_conn; # Distribute to instance with least active connections

        server backend-1:5000 max_fails=3 fail_timeout=10s;
        server backend-2:5000 max_fails=3 fail_timeout=10s;
        server backend-3:5000 max_fails=3 fail_timeout=10s;

        keepalive 32;
    }

    server {
        listen 80;
        server_name localhost;

        # Allow uploads up to 10 MB (comfortably accommodates 5 MB raw image limit)
        client_max_body_size 10M;

        # Proxy timeouts for AI analysis requests
        proxy_connect_timeout 60s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        # API Requests routed to backend load balancer pool
        location /api/ {
            proxy_pass http://petvision_backend;
            proxy_http_version 1.1;

            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Buffering configuration for streaming multipart uploads
            proxy_request_buffering on;
            proxy_buffering on;
        }

        # Frontend Static UI
        location / {
            proxy_pass http://frontend:80;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
        }

        # Health endpoint check
        location /health {
            proxy_pass http://petvision_backend/api/v1/health;
            access_log off;
        }
    }
}
